name: release

# ROLLING release: no tracked ./VERSION, so build.clj mints
# 0.{version.edn :minor}.{git-count-revs} on every push that changes the library
# — no bump, no commit, no tag. (Dropping a ./VERSION file back in switches this
# lib to PINNED mode with the same build.clj.)
#
# Path-filtered to library sources so CI / README / test-only commits don't mint
# an immutable pom. git-count still increments on every commit, so versions stay
# monotonic, just not contiguous.
#
# Secrets: MAVEN_USERNAME, MAVEN_TOKEN, MAVEN_URL — ORG-WIDE on hive-agi. NOT
# GITEA_-prefixed (Gitea reserves that prefix).

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # The suite gates the deploy, so a test-only change MUST be able to
      # trigger a run: excluded here, a test fix can never be validated and a
      # test-only regression stays invisible until some unrelated src push
      # trips over it.
      - 'test/**'
      - 'tests.edn'
      # Include the workflow itself so a change to the release pipeline is
      # exercised by the very push that makes it.
      - '.gitea/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      MAVEN_URL: ${{ secrets.MAVEN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOT DeLaGuardo/setup-clojure: that action calls the GitHub API
      # unconditionally and authenticates with GITHUB_TOKEN, which under Gitea
      # Actions is a *Gitea* token that github.com rejects. It logs ::error::
      # without failing its own step, so the job continues with no Clojure on
      # PATH and dies later with a bare exit 127, far from the cause.
      #
      # The official installer touches no API, so it behaves identically on
      # Gitea and GitHub. `clojure --version` is the assertion.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      # Give the resolver the private repo + credentials before any clojure cmd.
      - name: Materialize private-registry resolution credentials
        if: env.MAVEN_TOKEN != ''
        run: |
          # Mirror the clojure launcher's own resolution: $CLJ_CONFIG, else
          # $XDG_CONFIG_HOME/clojure when set, else $HOME/.clojure.
          CLJ_CONFIG="${CLJ_CONFIG:-${XDG_CONFIG_HOME:+$XDG_CONFIG_HOME/clojure}}"
          CLJ_CONFIG="${CLJ_CONFIG:-$HOME/.clojure}"
          mkdir -p "$CLJ_CONFIG" "$HOME/.m2"
          cat > "$CLJ_CONFIG/deps.edn" <<'EOF'
          {:mvn/repos {"hive-gitea" {:url "https://gitea.hive-mcp.com/api/packages/hive-agi/maven"}}}
          EOF
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>hive-gitea</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Gate BEFORE the deploy: a published pom is immutable, so a red suite
      # must not be able to mint one. Unconditional — a missing MAVEN_TOKEN
      # skips publishing, never testing.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      # Rolling: `deploy` reads version.edn :publish (:gitea) and publishes
      # 0.{minor}.{git-count}. Idempotent — a re-run at the same HEAD (same count)
      # HEAD-checks the registry and skips.
      - name: Deploy (rolling patch = git-count)
        if: env.MAVEN_TOKEN != ''
        run: clojure -T:build deploy
